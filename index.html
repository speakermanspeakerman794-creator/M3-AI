<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#090d18">
<title>M3 AI</title>
<style>
:root{--bg:#090d18;--panel:#111827;--panel2:#182235;--line:#26334a;--text:#f4f7ff;--muted:#9aa8bd;--accent:#7c5cff;--accent2:#20c7b5}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -15%,#25205a 0,transparent 42%),var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;min-height:100vh}
.app{max-width:900px;margin:auto;min-height:100vh;display:flex;flex-direction:column;padding:18px}
header{display:flex;align-items:center;justify-content:space-between;padding:12px 4px 18px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px}.logo{width:45px;height:45px;border-radius:15px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;font-size:19px;font-weight:900;box-shadow:0 8px 28px #765cff55}
h1{font-size:23px;margin:0;letter-spacing:.5px}.tagline{font-size:12px;color:var(--muted);margin-top:3px}
.status{font-size:11px;color:#7fe3ce;background:#12332f;border:1px solid #20554e;border-radius:30px;padding:7px 10px}
main{flex:1;display:flex;flex-direction:column;min-height:0}.welcome{text-align:center;margin:auto 0;padding:42px 12px 28px}.orb{width:76px;height:76px;border-radius:25px;margin:0 auto 18px;background:linear-gradient(135deg,#7c5cff,#20c7b5);display:grid;place-items:center;font-size:34px;box-shadow:0 15px 45px #705bff40}
.welcome h2{font-size:27px;margin:0 0 8px}.welcome p{color:var(--muted);margin:0 auto;max-width:440px;line-height:1.8;font-size:14px}
.suggestions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;max-width:580px;margin:25px auto 0;width:100%}
.suggestion{border:1px solid var(--line);background:#111a2a;color:#dce5f5;border-radius:14px;padding:13px;text-align:right;font:inherit;font-size:13px;cursor:pointer}.suggestion:hover{border-color:var(--accent);background:#1b2340}
#chat{display:none;flex-direction:column;gap:16px;padding:22px 2px 18px;overflow-y:auto;flex:1}
.message{display:flex;gap:10px;max-width:90%;align-items:flex-start}.message.user{align-self:flex-start;flex-direction:row-reverse}.message.bot{align-self:flex-end}
.avatar{width:31px;height:31px;flex:0 0 31px;border-radius:11px;display:grid;place-items:center;font-size:12px;font-weight:800;background:#293354;color:white}.bot .avatar{background:linear-gradient(135deg,var(--accent),var(--accent2))}
.bubble{padding:12px 15px;border-radius:16px;background:var(--panel2);line-height:1.8;font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}.user .bubble{background:#4937a8;border-top-left-radius:5px}.bot .bubble{border:1px solid var(--line);border-top-right-radius:5px}
.composer-wrap{padding:12px 0 6px}.composer{display:flex;align-items:flex-end;gap:9px;padding:9px;background:#111827;border:1px solid #34415a;border-radius:19px;box-shadow:0 12px 35px #0005}
textarea{flex:1;resize:none;max-height:140px;min-height:42px;border:0;outline:0;background:transparent;color:var(--text);font:inherit;font-size:14px;padding:10px 8px;line-height:1.5}textarea::placeholder{color:#8190a8}
.send{width:43px;height:43px;border:0;border-radius:14px;background:linear-gradient(135deg,var(--accent),#5941d8);color:white;font-size:19px;cursor:pointer}.send:disabled{opacity:.45;cursor:default}
.tools{display:flex;justify-content:space-between;align-items:center;padding:9px 4px;color:var(--muted);font-size:11px}.clear{border:0;background:none;color:#b9aaff;font:inherit;cursor:pointer}
footer{text-align:center;color:#78869c;font-size:11px;padding:14px 0 4px}footer strong{color:#aab6ca;font-weight:600}
@media(max-width:520px){.app{padding:12px}.welcome{padding-top:30px}.welcome h2{font-size:23px}.suggestions{grid-template-columns:1fr}.message{max-width:98%}.status{font-size:10px}}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="brand"><div class="logo">M3</div><div><h1>M3 AI</h1><div class="tagline">مساعدك الذكي في أي وقت</div></div></div>
  <div class="status" id="status">● متصل بالواجهة</div>
</header>
<main>
  <section class="welcome" id="welcome">
    <div class="orb">✦</div><h2>أهلاً بك في M3 AI</h2>
    <p>اسأل Gemini عن الدراسة، الأفكار، البرمجة، والكتابة.</p>
    <div class="suggestions">
      <button class="suggestion" data-prompt="اشرح لي الذكاء الاصطناعي بطريقة بسيطة">✦ اشرح لي الذكاء الاصطناعي</button>
      <button class="suggestion" data-prompt="اقترح لي فكرة تطبيق مميزة">▣ اقترح فكرة تطبيق</button>
      <button class="suggestion" data-prompt="ساعدني في تعلم HTML من الصفر">⌘ تعلم HTML من الصفر</button>
      <button class="suggestion" data-prompt="اكتب لي خطة لتنظيم وقتي">◷ نظّم وقتي</button>
    </div>
  </section>
  <section id="chat" aria-live="polite"></section>
</main>
<div class="composer-wrap">
  <div class="composer"><textarea id="prompt" rows="1" placeholder="اسأل M3 AI أي شيء..." aria-label="اكتب رسالتك"></textarea><button class="send" id="send" aria-label="إرسال">➤</button></div>
  <div class="tools"><span>قد تحدث أخطاء؛ راجع المعلومات المهمة.</span><button class="clear" id="clear">محادثة جديدة ↻</button></div>
</div>
<footer>M3 AI <span>•</span> <strong>من صنع MOU3TAZ M3</strong></footer>
</div>
<script>
const chat=document.getElementById('chat'),welcome=document.getElementById('welcome');
const input=document.getElementById('prompt'),send=document.getElementById('send'),statusEl=document.getElementById('status');
let history=[];
function addMessage(text,who){
 const row=document.createElement('div');row.className='message '+who;
 const avatar=document.createElement('div');avatar.className='avatar';avatar.textContent=who==='user'?'أنت':'M3';
 const bubble=document.createElement('div');bubble.className='bubble';bubble.textContent=text;
 row.append(avatar,bubble);chat.appendChild(row);chat.scrollTop=chat.scrollHeight;return bubble;
}
async function submit(){
 const q=input.value.trim();if(!q||send.disabled)return;
 welcome.style.display='none';chat.style.display='flex';addMessage(q,'user');
 input.value='';input.style.height='42px';send.disabled=true;
 const bubble=addMessage('يفكر Gemini...','bot');
 history.push({role:'user',text:q});
 try{
   const response=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:history})});
   const data=await response.json();
   if(!response.ok)throw new Error(data.error||'حدث خطأ في الاتصال.');
   bubble.textContent=data.reply||'لم يصل رد.';history.push({role:'model',text:data.reply||''});
   statusEl.textContent='● Gemini متصل';
 }catch(err){bubble.textContent='تعذر إكمال الطلب: '+err.message;history.pop();statusEl.textContent='● تحقق من الاتصال';}
 finally{send.disabled=false;input.focus();chat.scrollTop=chat.scrollHeight;}
}
send.addEventListener('click',submit);
input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();submit();}});
input.addEventListener('input',()=>{input.style.height='42px';input.style.height=Math.min(input.scrollHeight,140)+'px';});
document.querySelectorAll('.suggestion').forEach(b=>b.addEventListener('click',()=>{input.value=b.dataset.prompt;submit();}));
document.getElementById('clear').addEventListener('click',()=>{chat.innerHTML='';chat.style.display='none';welcome.style.display='block';input.value='';history=[];});
</script>
</body>
</html>
